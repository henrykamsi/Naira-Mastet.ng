  <script>
(function() {
    'use strict';

    const SERVER_URL = 'https://push-notification-server-5tx2.onrender.com';
    const API_KEY = 'sendly_live_mynairamasterapp_c9f4d57f0225d8f34595057c00e68fdb';
    const APP_NAME = 'Sendly Notification';

    if (!('Notification' in window)) {
        console.warn('Sendly: Notifications not supported');
        return;
    }

    function createPopup() {
        if (document.getElementById('sendly-popup-overlay')) return;

        const popupHTML = `
            <div id="sendly-popup-overlay" style="
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.75);

            ">
                <div id="sendly-popup" style="
                    background: #7c3aed;

                    width: 90%;
                    position: relative;
                    box-shadow: 0 25px 60px rgba(124, 58, 237, 0.5);
                    animation: sendlyFadeIn 0.4s ease-out;
                    text-align: center;
                ">
                    <button id="sendly-close-btn" style="
                        position: absolute;
                        top: 12px;
                        right: 16px;
                        background: none;
                        border: none;
                        font-size: 24px;
                        color: rgba(255,255,255,0.5);
                        cursor: pointer;
                        padding: 4px 8px;
                        transition: color 0.2s;
                    ">&times;</button>

                    <div style="margin-bottom: 12px;">
                        <span style="font-size: 48px;">🔔</span>
                    </div>

                    <h2 style="
                        font-size: 22px;
                        font-weight: 700;
                        color: #ffffff;
                        margin: 0 0 6px 0;
                    ">${APP_NAME}</h2>

                    <p style="
                        font-size: 15px;
                        color: rgba(255,255,255,0.85);
                        margin: 0 0 24px 0;
                        line-height: 1.6;
                    ">
                        Allow notifications to receive real-time updates and alerts.
                    </p>

                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button id="sendly-allow-btn" style="
                            background: #22c55e;
                            color: #ffffff;
                            border: none;
                            border-radius: 10px;
                            padding: 14px 28px;
                            font-size: 16px;

                            transition: background 0.2s, transform 0.1s;
                            flex: 1;
                            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
                        ">✅ Allow</button>

                        <button id="sendly-dismiss-btn" style="
                            background: #ef4444;
                            color: #ffffff;
                            border: none;
                            border-radius: 10px;
                            padding: 14px 28px;

                            cursor: pointer;
                            transition: background 0.2s, transform 0.1s;
                            flex: 1;
                            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
                        ">✕ Dismiss</button>
                    </div>

                    <div id="sendly-status" style="
                        margin-top: 16px;
                        font-size: 14px;
                        color: rgba(255,255,255,0.8);
                        display: none;
                    "></div>

                    <p style="
                        font-size: 11px;
                        color: rgba(255,255,255,0.4);
                        margin: 14px 0 0 0;
                    ">You can change this anytime in your browser settings</p>
                </div>
            </div>

            <style>
                @keyframes sendlyFadeIn {
                    from { opacity: 0; transform: scale(0.95) translateY(15px); }
                    to { opacity: 1; transform: scale(1) translateY(0); }
                }
                #sendly-allow-btn:hover {
                    background: #16a34a;
                    transform: scale(1.02);
                }
                #sendly-dismiss-btn:hover {
                    background: #dc2626;
                    transform: scale(1.02);

                    color: #86efac;

                #sendly-status.error {
                    color: #fca5a5;

            </style>
        `;

        const div = document.createElement('div');
        div.innerHTML = popupHTML;
        document.body.appendChild(div.firstElementChild);

        document.getElementById('sendly-allow-btn').addEventListener('click', function() {
            setStatus('⏳ Requesting permission...', '');
            requestBrowserPermission();
        });

        document.getElementById('sendly-dismiss-btn').addEventListener('click', function() {
            closePopup();
            localStorage.setItem('sendly_dismissed', 'true');
        });

        document.getElementById('sendly-close-btn').addEventListener('click', function() {
            closePopup();
            localStorage.setItem('sendly_dismissed', 'true');
        });

        document.getElementById('sendly-popup-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                // Do nothing
            }
        });

    function setStatus(message, type) {
        const statusEl = document.getElementById('sendly-status');
        if (statusEl) {
            statusEl.textContent = message;
            statusEl.className = type || '';
            statusEl.style.display = 'block';
        }
    }

    function closePopup() {
        const overlay = document.getElementById('sendly-popup-overlay');
        if (overlay) {
            overlay.remove();
        }
    }

    function requestBrowserPermission() {
        Notification.requestPermission().then(function(permission) {
            if (permission === 'granted') {
                setStatus('✅ Subscribed! Saving device...', 'success');
                registerServiceWorker();
                localStorage.removeItem('sendly_dismissed');
                localStorage.setItem('sendly_subscribed', 'true');
            } else if (permission === 'denied') {
                setStatus('❌ Permission denied.', 'error');
                setTimeout(() => { closePopup(); }, 2000);
                localStorage.setItem('sendly_blocked', 'true');
                localStorage.removeItem('sendly_dismissed');
            } else {
                setStatus('⚠️ Permission request cancelled.', '');
            }
        });
    }

    async function registerServiceWorker() {
        try {
            // ✅ AUTO-DETECT the correct path (works for any user, any subfolder)
            const swPath = window.location.pathname.split('/').slice(0, -1).join('/') + '/sw.js';
            const reg = await navigator.serviceWorker.register(swPath);
            console.log('Sendly: Service worker registered at', swPath);

            const keyRes = await fetch(SERVER_URL + '/api/v1/vapid-key');
            const keyData = await keyRes.json();

            function urlBase64ToUint8Array(base64String) {
                const padding = '='.repeat((4 - base64String.length % 4) % 4);
                const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
                const rawData = window.atob(base64);
                const outputArray = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; ++i) {
                    outputArray[i] = rawData.charCodeAt(i);
                }
                return outputArray;
            }

            const subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
            });

            const response = await fetch(SERVER_URL + '/api/v1/subscribe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-sendly-key': API_KEY
                },
                body: JSON.stringify(subscription)
            });

            const data = await response.json();

            if (data.status === 100) {
                console.log('✅ Sendly: Device registered successfully');
                setStatus('✅ Device saved! You will receive notifications.', 'success');
                setTimeout(() => { closePopup(); }, 2000);
            } else {
                console.error('Sendly: Registration failed', data);
                setStatus('❌ Registration failed: ' + (data.message || 'Unknown error'), 'error');
            }

        } catch (err) {
            console.error('Sendly registration error:', err);
            setStatus('❌ Error: ' + err.message, 'error');
        }
    }

    function shouldShowPopup() {
        if (Notification.permission === 'granted' || localStorage.getItem('sendly_subscribed') === 'true') {
            registerServiceWorker();
            return false;
        }

        if (Notification.permission === 'denied' || localStorage.getItem('sendly_blocked') === 'true') {
            return false;
        }

        if (localStorage.getItem('sendly_dismissed') === 'true') {
            return false;
        }

        return true;
    }

    function initSendly() {
        if (shouldShowPopup()) {
            createPopup();
        }
    }

    if (document.readyState === 'complete') {
        initSendly();
    } else {
        window.addEventListener('load', initSendly);
    }

    console.log('Sendly: SDK loaded');

})();

<!-- Squad & Verification Script -->
<script>
(function(){
  const SQUAD_PUBLIC_KEY = 'pk_0444847e55dc6f0540cb087335aebeb08f4aae59';
  const VERIFY_ENDPOINT = 'https://nairamaster-backend.onrender.com/api/verify-payment';
  const MIN_NGN = 100; // minimum amount in Naira

  function el(id){ return document.getElementById(id); }
  function showMsg(id, msg, isError){ const e=el(id); if(!e) return; e.style.display='block'; e.style.color = isError ? 'var(--destructive)' : 'var(--text-muted)'; e.textContent = msg; }
  function hideEl(id){ const e=el(id); if(e) e.style.display='none'; }

  function setBulbState(state){ // state: pending, success, error, neutral
    const bulb = el('fund-status-bulb');
    if(!bulb) return;
    if(state==='pending'){ bulb.style.background='#ffcc00'; bulb.title='Pending'; bulb.style.boxShadow='0 0 0 6px rgba(255,204,0,0.12)'; }
    else if(state==='success'){ bulb.style.background='#22c55e'; bulb.title='Success'; bulb.style.boxShadow='0 0 0 6px rgba(34,197,94,0.12)'; }
    else if(state==='error'){ bulb.style.background='#ef4444'; bulb.title='Failed'; bulb.style.boxShadow='0 0 0 6px rgba(239,68,68,0.12)'; }
    else { bulb.style.background='#9ca3af'; bulb.title='Idle'; bulb.style.boxShadow='none'; }
  }

  function getCurrentUserInfo(){
    try{
      if(window.firebase && firebase && firebase.auth){
        const u = firebase.auth().currentUser;
        if(u) return { email: u.email, uid: u.uid };
      }
    }catch(e){ }
    return { email: window.currentUserEmail || null, uid: window.currentUserUid || window.currentUserId || null };
  }

  function createTransactionRef(){ return 'NM_WLT_' + Date.now(); }

  async function verifyWithBackend(reference, userId, expectedAmount){
    try{
      const res = await fetch(VERIFY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transactionReference: reference, userId: userId, expectedAmount: expectedAmount })
      });
      const json = await res.json();
      return json;
    }catch(err){ console.error('Verify request failed', err); return { success:false, error:err.message }; }
  }

  async function handleTrigger(e){
    e.preventDefault();
    hideEl('fund-validation-msg');
    hideEl('squad-fund-status');

    const amountInput = el('userDepositAmount');
    if(!amountInput) return;
    const raw = Number(amountInput.value);
    if(!raw || isNaN(raw) || raw < MIN_NGN){
      el('fund-validation-msg').style.display='block';
      el('fund-validation-msg').textContent = `Enter an amount of at least ₦${MIN_NGN}`;
      setBulbState('error');
      return;
    }

    const user = getCurrentUserInfo();
    if(!user || !user.email || !user.uid){
      showMsg('squad-fund-status','Please sign in to continue', true);
      setBulbState('error');
      return;
    }

    setBulbState('pending');
    showMsg('squad-fund-status', 'Opening checkout...', false);

    const amountKobo = Math.round(raw * 100);
    const txnRef = createTransactionRef();

    if(typeof window.squad !== 'function' && typeof window.squad !== 'object'){
      showMsg('squad-fund-status', 'Payment library not loaded. Please include Squad widget script on the page.', true);
      console.error('Squad global not found');
      setBulbState('error');
      return;
    }

    try{
      const checkout = new squad({
        publicKey: SQUAD_PUBLIC_KEY,
        email: user.email,
        amount: amountKobo,
        reference: txnRef,
        metadata: { purpose:'wallet_topup', userId: user.uid },
        onSuccess: async function(transaction){
          showMsg('squad-fund-status','Payment completed. Verifying with server...', false);
          // verify with backend
          const payloadRef = transaction && transaction.reference ? transaction.reference : txnRef;
          const result = await verifyWithBackend(payloadRef, user.uid, raw);
          if(result && result.success===true){
            showMsg('squad-fund-status','✅ Payment verified successfully', false);
            setBulbState('success');
            // Optionally show larger success toast
            try{ if(typeof toast === 'function') toast('✅ Wallet funded successfully', 'success'); }catch(e){}
            // Refresh balance or reload
            setTimeout(()=>{ window.location.reload(); }, 1200);
          } else {
            const msg = (result && (result.message || result.error)) ? (result.message||result.error) : 'Verification failed';
            showMsg('squad-fund-status','Verification failed: ' + msg, true);
            setBulbState('error');
          }
        },
        onClose: function(){ showMsg('squad-fund-status','Checkout closed', false); setBulbState('neutral'); },
        onError: function(err){ showMsg('squad-fund-status','Checkout error: ' + (err && err.message?err.message:'Unknown'), true); setBulbState('error'); }
      });

      if(typeof checkout.open === 'function') checkout.open();
    }catch(err){
      showMsg('squad-fund-status','Failed to open checkout: ' + err.message, true);
      console.error('Squad init error', err);
      setBulbState('error');
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    const btn = el('triggerSquadBtn');
    if(btn) btn.addEventListener('click', handleTrigger);
    // Listen for backend webhook-driven event (if your backend emits client push via e.g., WebSocket or other)
    // For webhook-based verification, the UI polls the verify endpoint for a short time to confirm status if needed.
  });
})();
</script>
